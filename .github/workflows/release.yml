name: Release

# Push a tag matching the plugin version (e.g. v0.7.1) to build the .snplg
# and attach it to a GitHub release. Or run it by hand on main: the tag is
# then made from versionName in PluginConfig.json.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest
      - name: Release tag (the pushed tag must match PluginConfig.json)
        id: tag
        run: |
          version=$(node -p "require('./PluginConfig.json').versionName")
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != v$version"; exit 1; }
          fi
          echo "name=v$version" >> "$GITHUB_OUTPUT"
      - run: bash ./buildPlugin.sh
      - run: test -f build/outputs/ShapeSnap.snplg
      # The build is named after the plugin key (ShapeSnap), which must never change;
      # the release file carries the plugin's current name.
      - run: cp build/outputs/ShapeSnap.snplg build/outputs/Snap.snplg
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: build/outputs/Snap.snplg
          generate_release_notes: true
